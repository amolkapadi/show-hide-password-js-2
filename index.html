<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Show and Hide Password</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Show and hide password<br>field</h1>
      <p>Use this form to send us info about your project and<br>get us in touch</p>

      <input type="text" placeholder="Name">

      <div class="password-field">
        <input type="password" id="password" placeholder="Password">
        <button type="button" id="togglePassword">👁</button>
      </div>

      <button class="send-btn">SEND INFO</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
